<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canivete Suíço — ferramentas úteis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- O menu é montado pelo menu.js -->
  <header class="topo" id="topo"></header>
  <script src="menu.js"></script>

  <main>
    <h1>Ferramentas úteis, num lugar só</h1>
    <p class="subtitulo">Escolha uma ferramenta abaixo. Tudo grátis, sem cadastro.</p>

    <!-- Os cartões também são criados a partir da lista do menu.js -->
    <div class="grade" id="grade"></div>
  </main>

  <footer class="rodape">Feito com HTML, CSS e JavaScript · hospedado no GitHub Pages</footer>

  <script>
    const grade = document.getElementById("grade");

    // Um cartão para cada ferramenta da lista
    grade.innerHTML = FERRAMENTAS.map(f => `
      <a class="cartao" href="${f.arquivo}">
        <div class="emoji">${f.emoji}</div>
        <h2>${f.nome}</h2>
        <p>${f.descricao}</p>
      </a>
    `).join("");

    // E um cartão especial para a Surpresa
    grade.innerHTML += `
      <a class="cartao cartao-surpresa" href="#" onclick="irParaSurpresa(); return false;">
        <div class="emoji">🎁</div>
        <h2>Surpresa!</h2>
        <p>Não sabe o que quer? Clique e vá para uma ferramenta aleatória.</p>
      </a>`;
  </script>
</body>
</html>
