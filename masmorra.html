<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caçador de Dragões — Canivete Suíço</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================
       CAÇADOR DE DRAGÕES — roguelike por turnos + incremental
       Estilo e lógica moram neste arquivo; a arte (sprites SVG,
       cenários e portas) mora em masmorra-arte.js.
       ========================================================== */
    :root {
      --pedra: #0e0f12;
      --painel: #17191e;
      --painel-2: #20232a;
      --painel-3: #2a2e37;
      --linha: #343a45;
      --texto-m: #ece6d8;
      --fraco: #a3a9b4;
      --tocha: #f59e0b;
      --tocha-2: #fbbf24;
      --ouro: #e0a82e;
      --sangue: #dc2626;
      --escudo: #60a5fa;
      --veneno: #4ade80;
      --escama: #22d3ee;
      --roxo: #a78bfa;
      --bioma: #b45309;
      --perigo: 0;
      --vel: 1;
      --cor-tocha: #f59e0b;
      --nevoa: 200,190,170;
      --r-comum: #9ca3af;
      --r-rara: #60a5fa;
      --r-epica: #c084fc;
      --r-lendaria: #fbbf24;
    }

    body.masmorra {
      background:
        radial-gradient(ellipse at 50% -10%, #2a2116 0%, transparent 60%),
        linear-gradient(rgba(0,0,0,.35) 1px, transparent 1px) 0 0 / 64px 32px,
        linear-gradient(90deg, rgba(0,0,0,.3) 1px, transparent 1px) 0 0 / 64px 64px,
        var(--pedra);
      font-family: "Alegreya", Georgia, serif;
      font-size: 17px;
      color: var(--texto-m);
    }
    body.masmorra .topo { position: static; background: #0b0c0e; border-bottom: 2px solid #5a3b10; }
    body.masmorra .menu a.ativo { background: #7c2d12; }
    h2, h3, .cinzel { font-family: "Cinzel", Georgia, serif; }
    .spr { display: block; width: 100%; height: 100%; overflow: visible; }
    kbd { font-family: inherit; }

    #jogo { max-width: 1320px; margin: 0 auto; padding: 14px 16px 48px; }

    /* ---------- Barra do topo ---------- */
    .barra {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      background: linear-gradient(#1d1a15, #121110);
      border: 1px solid #5a3b10; border-radius: 10px;
      padding: 8px 16px; margin-bottom: 14px;
      box-shadow: 0 0 30px rgba(245,158,11,.08);
    }
    .barra .titulo { display: flex; align-items: center; gap: 10px; font-family: "Cinzel", serif; font-weight: 800; font-size: 1.3rem; color: var(--tocha-2); margin-right: auto; text-shadow: 0 0 12px rgba(245,158,11,.45); }
    .barra .titulo .spr { width: 34px; height: 34px; }
    .barra .item { display: flex; align-items: center; gap: 6px; color: var(--fraco); font-size: .95rem; }
    .barra .item .spr { width: 22px; height: 22px; }
    .barra .item b { color: var(--texto-m); font-size: 1.1rem; }
    .barra .item.esc b { color: var(--escama); }
    .btn-debug { background: none; border: 1px dashed #4b5160; color: #6b7280; font-size: .78rem; padding: 3px 9px; font-weight: 600; font-family: inherit; letter-spacing: .05em; }
    #jogo .btn-debug:hover { color: #c4b5fd; border-color: #7e22ce; background: none; }
    .btn-debug.ativos { color: #d8b4fe; border-color: #a855f7; border-style: solid; }
    body.em-run .so-menu { display: none !important; }

    /* ---------- Mesa: 3 colunas, central com largura estável ---------- */
    .mesa { display: grid; grid-template-columns: 270px minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
    .painel {
      background: linear-gradient(180deg, var(--painel), #131519);
      border: 1px solid var(--linha); border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .titulo-painel { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; color: var(--tocha-2); letter-spacing: .06em; margin-bottom: 10px; }
    .titulo-painel .spr, .sub .spr { width: 22px; height: 22px; }
    .sub { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--tocha); margin: 14px 0 8px; letter-spacing: .05em; }
    .sub small { color: var(--fraco); font-family: "Alegreya", serif; letter-spacing: 0; font-size: .9rem; }
    .fraco { color: var(--fraco); }
    .pequeno { font-size: .9rem; }

    /* ---------- Painel do herói ---------- */
    .heroi-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .retrato {
      width: 62px; height: 62px; flex: none; border-radius: 12px; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #3a2a1a, #120d09);
      border: 2px solid #7a5a1c; box-shadow: 0 0 14px rgba(245,158,11,.25);
    }
    .heroi-nome { font-family: "Cinzel", serif; font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
    .nivel-selo { display: inline-block; margin-top: 3px; padding: 1px 10px; border-radius: 20px; background: #2e1f4f; border: 1px solid #6d28d9; color: #ddd6fe; font-family: "Cinzel", serif; font-size: .8rem; font-weight: 800; }

    .barra-st {
      position: relative; height: 26px; border-radius: 7px; overflow: hidden; margin-bottom: 7px;
      background: #1a0c0d; border: 1px solid #000; box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
    }
    .barra-st > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 6px 0 0 6px; }
    .barra-st > .rastro { background: #fde68a; opacity: .75; transition: width calc(.6s / var(--vel)) ease-out; }
    .barra-st > .cheio { transition: width calc(.35s / var(--vel)) ease-out; }
    .barra-st > .cheio::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,.04)); }
    .barra-st > span { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 100%; font-weight: 700; font-size: .92rem; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
    .barra-st > span .spr { width: 16px; height: 16px; }
    .barra-st.vida > .cheio { background: linear-gradient(#f05252, #b91c1c 60%, #8f1515); box-shadow: 0 0 10px rgba(239,68,68,.55); }
    .barra-st.xp { height: 18px; background: #140f22; }
    .barra-st.xp > .cheio { background: linear-gradient(#a78bfa, #7c3aed); box-shadow: 0 0 8px rgba(139,92,246,.6); }
    .barra-st.xp > .rastro { background: #ddd6fe; }
    .barra-st.xp > span { font-size: .8rem; }
    .barra-st.inimigo { height: 22px; }
    .barra-st.inimigo > .cheio { background: linear-gradient(#f97316, #c2410c 55%, #7f1d1d); box-shadow: 0 0 10px rgba(249,115,22,.5); }

    .status { display: flex; gap: 6px; flex-wrap: wrap; }
    .status:empty { display: none; }
    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 700; padding: 2px 9px 2px 5px; border-radius: 20px; background: rgba(20,22,27,.85); border: 1px solid var(--linha); }
    .tag .spr { width: 16px; height: 16px; }
    .tag.bloq { color: #93c5fd; border-color: #1e3a8a; box-shadow: 0 0 8px rgba(96,165,250,.35); }
    .tag.ven { color: var(--veneno); border-color: #14532d; box-shadow: 0 0 8px rgba(74,222,128,.3); }
    .tag.fur { color: #fca5a5; border-color: #7f1d1d; }

    .recursos { display: flex; gap: 6px; margin: 8px 0; }
    .recurso { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 8px; padding: 4px 6px; font-weight: 700; font-size: .95rem; }
    .recurso .spr { width: 20px; height: 20px; flex: none; }
    .recurso.esc { color: var(--escama); }
    .atributos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .atributo { display: flex; align-items: center; gap: 8px; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 8px; padding: 5px 8px; font-size: .85rem; color: var(--fraco); line-height: 1.15; }
    .atributo .spr { width: 24px; height: 24px; flex: none; }
    .atributo b { display: block; color: var(--texto-m); font-size: 1.08rem; }
    .reliquias { display: flex; flex-wrap: wrap; gap: 6px; }
    .reliq-ico {
      position: relative; width: 42px; height: 42px; padding: 5px;
      background: radial-gradient(circle at 50% 35%, #2c2a33, #17161b); border: 2px solid var(--r-comum); border-radius: 9px; cursor: help;
    }
    #jogo .reliq-ico:hover, .reliq-ico:focus-visible { background: radial-gradient(circle at 50% 35%, #3a3644, #1d1b22); }
    .reliq-ico.r-rara { border-color: var(--r-rara); }
    .reliq-ico.r-epica { border-color: var(--r-epica); box-shadow: 0 0 8px rgba(192,132,252,.35); }
    .reliq-ico.r-lendaria { border-color: var(--r-lendaria); box-shadow: 0 0 10px rgba(251,191,36,.45); }
    .reliq-ico .tip {
      position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 30; width: 220px; text-align: left;
      background: #0f1014; border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px;
      font-size: .88rem; font-weight: 400; color: var(--texto-m); line-height: 1.35;
      box-shadow: 0 8px 20px rgba(0,0,0,.6); pointer-events: none;
      opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
    }
    .reliq-ico .tip b { display: block; font-family: "Cinzel", serif; color: var(--tocha-2); margin-bottom: 2px; }
    .reliq-ico:hover .tip, .reliq-ico:focus-visible .tip { opacity: 1; transform: none; }
    .reliq-info { margin-top: 6px; font-size: .9rem; color: var(--fraco); }
    .reliq-info:empty { display: none; }
    .reliq-info b { color: var(--texto-m); }

    /* ---------- Painel central ---------- */
    .centro { padding: 0; margin: 0; max-width: none; width: 100%; overflow: hidden; border-top: 3px solid var(--bioma); }
    /* o style.css do site pinta todo botão de azul no hover: aqui cada botão define o seu */
    #jogo button:disabled { opacity: 1; }
    .andar-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--linha); background: rgba(0,0,0,.25); min-height: 62px; }
    .andar-topo .num { font-family: "Cinzel", serif; font-weight: 800; font-size: 1.35rem; color: var(--tocha-2); line-height: 1.1; }
    .andar-topo .bioma { text-align: right; font-style: italic; color: var(--fraco); line-height: 1.3; }
    .andar-topo .bioma b { font-style: normal; font-family: "Cinzel", serif; color: var(--texto-m); font-size: .95rem; }
    .trilha { display: flex; align-items: center; gap: 3px; margin-top: 5px; }
    .trilha i { width: 16px; height: 6px; border-radius: 2px; background: #2c313a; }
    .trilha i.feito { background: var(--tocha); }
    .trilha i.aqui { background: var(--tocha-2); box-shadow: 0 0 8px var(--tocha-2); }
    .trilha .spr { width: 20px; height: 20px; opacity: .55; }
    .trilha .spr.aqui { opacity: 1; filter: drop-shadow(0 0 6px #ef4444); }

    /* Palco: cenário + personagens */
    .palco { position: relative; height: 330px; overflow: hidden; background: #050403; isolation: isolate; }
    .fundo, .nevoa, .perigo-veu, .camada { position: absolute; inset: 0; }
    .fundo .cenario-svg { width: 100%; height: 100%; display: block; }
    .nevoa { pointer-events: none; opacity: .5; mix-blend-mode: screen; }
    .nevoa.n1 { background: radial-gradient(ellipse 40% 18% at 20% 78%, rgba(var(--nevoa), .22), transparent 70%), radial-gradient(ellipse 35% 14% at 70% 84%, rgba(var(--nevoa), .18), transparent 70%); animation: nevoa calc(26s) linear infinite alternate; }
    .nevoa.n2 { background: radial-gradient(ellipse 30% 12% at 45% 72%, rgba(var(--nevoa), .16), transparent 70%), radial-gradient(ellipse 45% 16% at 90% 76%, rgba(var(--nevoa), .14), transparent 70%); animation: nevoa calc(34s) linear infinite alternate-reverse; }
    .perigo-veu { pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(120,10,10,.75) 100%); opacity: calc(var(--perigo) * .7); }
    .palco::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.65) 100%); z-index: 3; }
    .tocha { position: absolute; top: 74px; width: 26px; height: 58px; z-index: 1; pointer-events: none; }
    .tocha.t-esq { left: 9%; } .tocha.t-dir { right: 9%; }
    .tocha::before { content: ""; position: absolute; left: 50%; top: 10px; width: 210px; height: 210px; transform: translate(-50%, -50%); background: radial-gradient(circle, color-mix(in srgb, var(--cor-tocha) 38%, transparent), transparent 65%); animation: tremeluz 2.3s ease-in-out infinite alternate; mix-blend-mode: screen; }
    .tocha-svg { width: 100%; height: 100%; overflow: visible; position: relative; }
    .tocha .chama { transform-origin: 20px 38px; animation: chama .5s ease-in-out infinite alternate; }
    .camada { z-index: 2; }

    /* Atores */
    .ator { position: absolute; bottom: 30px; }
    .ator .corpo { position: relative; z-index: 1; transform-origin: 50% 100%; }
    .ator .sombra { position: absolute; left: 12%; right: 12%; bottom: -6px; height: 16px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.75), transparent 70%); }
    .ator.voa .sombra { bottom: -16px; opacity: .6; }
    .ator-heroi { left: 9%; width: 160px; height: 160px; }
    .ator-inimigo { right: 9%; width: 190px; height: 190px; }
    .ator-inimigo.elite .corpo { filter: drop-shadow(0 0 10px rgba(249,115,22,.65)); }
    .ator-inimigo.chefe { right: 3%; width: 330px; height: 250px; bottom: 22px; }
    .ator-inimigo.chefe .corpo { filter: drop-shadow(0 0 18px rgba(220,38,38,.45)); }
    .ator .corpo, .ator .corpo .spr { width: 100%; height: 100%; }
    .ator.envenenado .corpo { filter: drop-shadow(0 0 8px rgba(74,222,128,.7)) saturate(.8); }
    .idle { animation: respira 2.6s ease-in-out infinite; }
    .ator.voa .idle { animation: flutua 2.2s ease-in-out infinite; }
    .ator.chefe .idle { animation: respira 3.4s ease-in-out infinite; }
    .aura-escudo {
      position: absolute; inset: -14px -10px -6px; z-index: 2; border-radius: 50% 50% 46% 46%; pointer-events: none;
      border: 2px solid rgba(147,197,253,.85);
      background: radial-gradient(ellipse at 50% 45%, rgba(96,165,250,.06), rgba(96,165,250,.28) 70%, rgba(147,197,253,.45));
      box-shadow: 0 0 22px rgba(96,165,250,.55), inset 0 0 18px rgba(147,197,253,.4);
      animation: escudo calc(.4s / var(--vel)) ease-out, escudo-pulsa 1.6s ease-in-out infinite;
    }
    .aura-escudo b { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-family: "Cinzel", serif; font-size: .85rem; color: #dbeafe; background: #1e3a8a; border: 1px solid #93c5fd; border-radius: 10px; padding: 0 8px; }

    /* HUD do inimigo e intenção */
    .hud-inimigo { position: absolute; top: 12px; right: 4%; width: min(300px, 44%); z-index: 4; text-align: right; }
    .nome-inimigo { font-family: "Cinzel", serif; font-weight: 800; font-size: 1.05rem; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
    .nome-inimigo.elite { color: #fb923c; }
    .nome-inimigo.chefe { color: #fca5a5; text-shadow: 0 0 12px rgba(220,38,38,.8), 0 2px 4px #000; }
    .hud-inimigo .status { justify-content: flex-end; }
    .intencao {
      position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); z-index: 4;
      display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 14px;
      background: rgba(14,15,18,.88); border: 2px solid #4b5160; box-shadow: 0 8px 22px rgba(0,0,0,.6);
      white-space: nowrap;
    }
    .intencao .it-ico { width: 46px; height: 46px; flex: none; }
    .intencao b { display: block; font-family: "Cinzel", serif; font-size: 1.7rem; line-height: 1; }
    .intencao small { display: block; color: var(--fraco); font-size: .82rem; }
    .intencao .rotulo { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; background: #0e0f12; color: var(--fraco); padding: 0 8px; border-radius: 8px; border: 1px solid #4b5160; }
    .intencao.perigo { border-color: #dc2626; background: rgba(42,10,10,.92); animation: alerta calc(.9s) ease-in-out infinite alternate; }
    .intencao.perigo b { color: #fca5a5; }
    .intencao.perigo .rotulo { border-color: #dc2626; color: #fca5a5; }
    .intencao.calmo b { color: #93c5fd; }
    .intencao.vs-chefe { left: 30%; top: 24%; }

    /* Cenas de evento (palco com um objeto central) */
    .objeto-central { position: absolute; left: 50%; bottom: 36px; width: 170px; height: 170px; transform: translateX(-50%); }
    .objeto-central::before { content: ""; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--brilho, 251,191,36), .28), transparent 65%); animation: tremeluz 2.4s ease-in-out infinite alternate; }
    .objeto-central .spr { position: relative; }
    .objeto-central.icone { width: 120px; height: 120px; bottom: 70px; }
    .titulo-palco { position: absolute; top: 18px; left: 0; right: 0; text-align: center; z-index: 4; font-family: "Cinzel", serif; font-weight: 800; font-size: 1.8rem; color: var(--tocha-2); text-shadow: 0 0 18px rgba(245,158,11,.6), 0 2px 4px #000; }
    .titulo-palco.roxo { color: #e9d5ff; text-shadow: 0 0 18px rgba(167,139,250,.7), 0 2px 4px #000; }
    .ator-heroi.heroi-centro { left: calc(50% - 80px); }
    .heroi-centro::before { content: ""; position: absolute; inset: -40px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(251,191,36,.25), transparent 20%, rgba(251,191,36,.2), transparent 45%, rgba(251,191,36,.25), transparent 70%); animation: gira 9s linear infinite; }
    .ator.caido { left: 12%; bottom: -8px; width: 150px; height: 150px; transform: rotate(-80deg); transform-origin: 50% 50%; filter: grayscale(.75) brightness(.6); }
    .ator.caido .spr { width: 100%; height: 100%; }

    /* Portas */
    .portas { position: absolute; inset: 14px 14px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
    .portas.n1 { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    .porta {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: none; border: none; padding: 0; color: var(--texto-m); font-family: inherit; font-weight: 400; font-size: .92rem; border-radius: 12px;
    }
    #jogo .porta:hover { background: none; }
    .porta-moldura { position: relative; width: 132px; height: 176px; transition: transform calc(.18s / var(--vel)), filter calc(.18s / var(--vel)); }
    .porta-arte { width: 100%; height: 100%; display: block; overflow: visible; }
    .porta-halo { animation: tremeluz 2.6s ease-in-out infinite alternate; }
    .porta-emblema { position: absolute; left: 50%; top: -8px; width: 40px; height: 40px; transform: translateX(-50%); padding: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3b3631, #1a1714); border: 2px solid #7a5a1c; box-shadow: 0 4px 10px rgba(0,0,0,.6); }
    .porta-rotulo { display: grid; justify-items: center; align-content: center; gap: 1px; text-align: center; min-height: 70px; background: rgba(10,10,12,.78); border: 1px solid #3a332a; border-radius: 9px; padding: 4px 10px; width: 100%; max-width: 210px; }
    .porta-rotulo b { font-family: "Cinzel", serif; font-weight: 800; color: var(--tocha-2); font-size: .98rem; }
    .porta-rotulo .dica { display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; font-size: .86rem; color: #d6d0c4; line-height: 1.25; }
    .porta-rotulo .dica .spr { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; }
    .porta-rotulo .dica .mini-inimigo, .porta-rotulo .dica .mini-inimigo .spr { width: 28px; height: 28px; }
    .porta kbd { position: absolute; top: 6px; right: calc(50% - 76px); font-size: .72rem; color: #8b8f99; background: rgba(0,0,0,.6); border: 1px solid #3a3f4a; border-radius: 5px; padding: 0 5px; }
    .porta:hover .porta-moldura, .porta:focus-visible .porta-moldura { transform: translateY(-6px) scale(1.04); filter: drop-shadow(0 0 16px rgba(245,158,11,.45)) brightness(1.15); }
    .porta.p-elite .porta-rotulo b { color: #fb923c; }
    .porta.p-chefe .porta-moldura { width: 166px; height: 222px; }
    .porta.p-chefe .porta-rotulo b { color: #fca5a5; }
    .porta.p-chefe:hover .porta-moldura { filter: drop-shadow(0 0 22px rgba(220,38,38,.6)) brightness(1.15); }
    .porta.entrando .porta-moldura { animation: entrar-porta calc(.38s / var(--vel)) ease-in forwards; }
    .palco.mergulho .camada > .portas > .porta:not(.entrando) { opacity: .25; transition: opacity calc(.2s / var(--vel)); }

    /* ---------- Parte de baixo do painel central ---------- */
    .inferior { padding: 14px 16px 16px; min-height: 236px; }
    .texto-cena { text-align: center; margin-bottom: 12px; }
    .texto-cena h3 { font-size: 1.15rem; color: var(--tocha-2); margin-bottom: 4px; }
    .texto-cena p { max-width: 560px; margin: 0 auto; color: #d6d0c4; }
    .dica-portas { text-align: center; color: var(--fraco); margin: 2px 0 6px; }

    .acoes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .acao {
      position: relative; display: grid; justify-items: center; gap: 2px; padding: 12px 6px 10px;
      background: linear-gradient(180deg, #2f3440, #20242d); color: var(--texto-m);
      border: 1px solid #4a5160; border-radius: 12px; font-family: inherit; font-size: .95rem; font-weight: 400;
      box-shadow: 0 4px 0 #0c0d10, 0 6px 14px rgba(0,0,0,.35);
      transition: transform .08s, box-shadow .08s, border-color .12s, background .12s;
    }
    .acao .a-ico { width: 44px; height: 44px; margin-bottom: 2px; transition: transform .12s; }
    .acao .a-nome { font-family: "Cinzel", serif; font-weight: 800; font-size: .9rem; line-height: 1.15; text-align: center; }
    .acao .a-info { font-size: .85rem; color: var(--fraco); }
    .acao kbd { position: absolute; top: 6px; left: 8px; font-size: .7rem; color: #6b7280; border: 1px solid #3f4553; border-radius: 4px; padding: 0 4px; }
    #jogo .acao:hover:not(:disabled) { background: linear-gradient(180deg, #3a4150, #282d38); border-color: var(--tocha); }
    .acao:hover:not(:disabled) .a-ico { transform: scale(1.1) rotate(-4deg); }
    .acao:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #0c0d10, 0 2px 6px rgba(0,0,0,.35); }
    .acao:hover { background: linear-gradient(180deg, #2f3440, #20242d); }
    .acao.especial:hover { background: linear-gradient(180deg, #3a2a22, #251b16); }
    .acao:disabled { opacity: .42 !important; cursor: not-allowed; filter: grayscale(.7); }
    .acao.especial { border-color: #7c2d12; background: linear-gradient(180deg, #3a2a22, #251b16); }
    .acao.sugerida { border-color: var(--tocha-2); box-shadow: 0 4px 0 #0c0d10, 0 0 0 1px var(--tocha-2), 0 0 18px rgba(251,191,36,.35); }
    .acao.sugerida::after { content: "melhor jogada"; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; background: var(--tocha-2); color: #1c1306; font-weight: 800; padding: 0 7px; border-radius: 6px; white-space: nowrap; }
    .acao .recarga { position: absolute; top: 6px; right: 8px; display: flex; gap: 3px; }
    .acao .recarga i { width: 7px; height: 7px; border-radius: 50%; background: #f97316; box-shadow: 0 0 6px #f97316; }

    .cartas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .cartas.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 520px; margin: 0 auto; }
    .cartas.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .carta {
      position: relative; display: grid; gap: 4px; justify-items: center; align-content: start; text-align: center; padding: 16px 10px 12px;
      background: linear-gradient(180deg, #24222c, #17161c); color: var(--texto-m);
      border: 2px solid var(--r-comum); border-radius: 14px; font-family: inherit; font-weight: 400; font-size: .95rem;
      box-shadow: 0 6px 16px rgba(0,0,0,.4);
      transition: transform calc(.14s / var(--vel)), box-shadow .14s, border-color .14s;
    }
    .carta .c-ico { width: 58px; height: 58px; margin-bottom: 2px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
    .carta .c-rar { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--r-comum); font-weight: 700; }
    .carta .c-nome { font-family: "Cinzel", serif; font-weight: 800; font-size: .98rem; color: var(--texto-m); line-height: 1.2; }
    .carta .c-desc { font-size: .9rem; color: #cfc9bd; line-height: 1.3; }
    .carta kbd { position: absolute; top: 6px; left: 8px; font-size: .7rem; color: #6b7280; border: 1px solid #3f4553; border-radius: 4px; padding: 0 4px; }
    .carta .preco { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-weight: 700; color: var(--tocha-2); }
    .carta .preco .spr { width: 18px; height: 18px; }
    #jogo .carta:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb, var(--r-cor, #9ca3af) 45%, transparent); background: linear-gradient(180deg, #2c2a36, #1b1a21); }
    .carta:hover { background: linear-gradient(180deg, #24222c, #17161c); }
    .carta:disabled { opacity: .45 !important; cursor: not-allowed; }
    .carta.r-comum { --r-cor: var(--r-comum); }
    .carta.r-rara { --r-cor: var(--r-rara); border-color: var(--r-rara); background: linear-gradient(180deg, #1d2534, #151a24); }
    .carta.r-rara .c-rar { color: var(--r-rara); }
    .carta.r-epica { --r-cor: var(--r-epica); border-color: var(--r-epica); background: linear-gradient(180deg, #2a1f3a, #1a1524); }
    .carta.r-epica .c-rar { color: var(--r-epica); }
    .carta.r-lendaria { --r-cor: var(--r-lendaria); border-color: var(--r-lendaria); background: linear-gradient(180deg, #33280f, #1f190b); box-shadow: 0 0 16px rgba(251,191,36,.25); }
    .carta.r-lendaria .c-rar { color: var(--r-lendaria); }
    .carta.so-texto { padding: 14px 12px; align-content: center; min-height: 64px; }
    .carta.so-texto .c-nome { font-size: .95rem; }
    .cartas-entrada .carta { animation: carta-entra calc(.4s / var(--vel)) cubic-bezier(.2,.9,.3,1.2) backwards; }
    .cartas-entrada .carta:nth-child(2) { animation-delay: calc(.07s / var(--vel)); }
    .cartas-entrada .carta:nth-child(3) { animation-delay: calc(.14s / var(--vel)); }
    .cartas-entrada .carta:nth-child(4) { animation-delay: calc(.21s / var(--vel)); }
    .cartas-entrada .carta:nth-child(5) { animation-delay: calc(.28s / var(--vel)); }

    .botao-tocha {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(180deg, #d97706, #92400e); color: #fff7e6;
      border: 1px solid #f59e0b; font-family: "Cinzel", serif; font-weight: 800; letter-spacing: .03em;
      padding: 12px 22px; border-radius: 10px; box-shadow: 0 4px 0 #4a2306, 0 0 18px rgba(245,158,11,.2);
      transition: transform .08s, box-shadow .08s;
    }
    .botao-tocha .spr { width: 22px; height: 22px; }
    #jogo .botao-tocha:hover { background: linear-gradient(180deg, #f59e0b, #b45309); }
    .botao-tocha:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a2306; }
    .centralizar { text-align: center; margin-top: 14px; }
    .botao-leve { background: var(--painel-2); border: 1px solid var(--linha); color: var(--texto-m); font-family: inherit; font-size: .9rem; font-weight: 600; padding: 7px 14px; }
    #jogo .botao-leve:hover { background: var(--painel-3); }

    .auto-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--linha); }
    .chave { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 20px; background: var(--painel-2); border: 1px solid var(--linha); color: var(--texto-m); font-family: inherit; font-size: .88rem; font-weight: 600; }
    .chave .spr { width: 20px; height: 20px; }
    #jogo .chave:hover { background: var(--painel-3); }
    .chave.on { border-color: var(--veneno); color: var(--veneno); box-shadow: 0 0 10px rgba(74,222,128,.2); }

    /* ---------- Guilda (menu) ---------- */
    .partidas { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .guilda { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .upg {
      position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center; text-align: left;
      background: linear-gradient(180deg, #22252d, #1a1c22); color: var(--texto-m); border: 1px solid var(--linha); border-radius: 12px;
      padding: 10px 12px 10px 10px; font-family: inherit; font-weight: 400; font-size: .9rem;
      transition: transform .1s, border-color .12s, box-shadow .12s;
    }
    .upg .u-ico { width: 46px; height: 46px; padding: 6px; border-radius: 10px; background: radial-gradient(circle at 50% 35%, #2f333d, #16181d); border: 1px solid #3a404b; }
    .upg .u-nome { display: flex; justify-content: space-between; gap: 6px; font-family: "Cinzel", serif; font-weight: 800; font-size: .92rem; }
    .upg .u-niv { font-family: "Alegreya", serif; color: var(--fraco); font-size: .85rem; font-weight: 700; }
    .upg .u-desc { display: block; color: var(--fraco); font-size: .88rem; line-height: 1.3; margin: 1px 0 4px; }
    .upg .u-pips { display: flex; gap: 3px; margin-bottom: 4px; }
    .upg .u-pips i { flex: 1; max-width: 18px; height: 5px; border-radius: 3px; background: #2c313a; }
    .upg .u-pips i.on { background: var(--escama); box-shadow: 0 0 5px rgba(34,211,238,.5); }
    .upg .u-prog { height: 5px; border-radius: 3px; background: #2c313a; overflow: hidden; margin-bottom: 4px; }
    .upg .u-prog i { display: block; height: 100%; background: var(--escama); }
    .upg .u-custo { display: inline-flex; align-items: center; gap: 4px; color: var(--escama); font-weight: 700; }
    .upg .u-custo .spr { width: 16px; height: 16px; }
    .upg:hover, .upg:disabled:hover { background: linear-gradient(180deg, #22252d, #1a1c22); }
    .upg:disabled:not(.max) { opacity: .62 !important; }
    #jogo .upg:hover:not(:disabled) { background: linear-gradient(180deg, #282c36, #1e2027); border-color: var(--escama); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.4), 0 0 14px rgba(34,211,238,.18); }
    .upg.pode { border-color: #155e75; }
    .upg.pode .u-ico { border-color: #0e7490; box-shadow: 0 0 10px rgba(34,211,238,.25); }
    .upg:disabled { cursor: default; }
    .upg:disabled:not(.max) .u-custo { color: #64748b; }
    .upg:disabled:not(.max) .u-ico { filter: grayscale(.5) brightness(.8); }
    .upg.max { border-color: #14532d; }
    .upg.max .u-custo { color: var(--veneno); }
    .upg.comprado { animation: comprado calc(.6s / var(--vel)) ease-out; }

    .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: .95rem; }
    .stats dd { text-align: right; font-weight: 700; }
    .stats-morte { max-width: 360px; margin: 10px auto 0; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 14px; }
    .botoes-save { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
    .botoes-save button { background: var(--painel-2); border: 1px solid var(--linha); font-size: .85rem; padding: 6px 10px; font-weight: 600; font-family: inherit; color: var(--texto-m); }
    #jogo .botoes-save button:hover { background: var(--painel-3); }
    .botoes-save button.perigo:hover { border-color: #b91c1c; color: #fca5a5; }

    /* ---------- Diário ---------- */
    .registro { list-style: none; max-height: 520px; overflow-y: auto; font-size: .875rem; line-height: 1.35; padding-right: 4px; scroll-behavior: smooth; }
    .registro li { padding: 4px 2px 4px 10px; border-left: 2px solid #2c313a; margin-bottom: 2px; color: #b8bcc5; }
    .registro li.causado { color: #fcd34d; border-left-color: #b45309; }
    .registro li.recebido { color: #fca5a5; border-left-color: #b91c1c; }
    .registro li.evento { color: #ddd6fe; border-left-color: #7c3aed; }
    .registro li:last-child { background: rgba(255,255,255,.04); }
    .legenda { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: .78rem; color: var(--fraco); margin: -4px 0 8px; }
    .legenda i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

    /* ---------- Painel de cheats (debug) ---------- */
    .cheats-fundo { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.65); display: grid; place-items: center; padding: 16px; }
    .cheats-fundo[hidden] { display: none; }
    .cheats { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: #1a1424; border: 2px solid #7e22ce; border-radius: 12px; padding: 18px; box-shadow: 0 0 40px rgba(168,85,247,.35); }
    .cheats h2 { color: #e9d5ff; font-size: 1.15rem; text-align: center; margin-bottom: 4px; }
    .cheats h3 { color: #c4b5fd; font-size: .9rem; margin: 16px 0 8px; }
    .cheats .grade-c { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    .cheats label { display: grid; gap: 4px; font-size: .9rem; color: var(--texto-m); margin: 0; }
    .cheats select { margin: 0; padding: 6px 8px; background: #241b33; border-color: #4c3d78; color: var(--texto-m); font-size: .95rem; }
    .cheats select.mudado { border-color: #a855f7; color: #e9d5ff; font-weight: 700; }
    .cheats .botoes-c { display: flex; flex-wrap: wrap; gap: 6px; }
    .cheats .botoes-c button { background: #2e2342; border: 1px solid #4c3d78; color: var(--texto-m); font-size: .85rem; padding: 7px 10px; font-family: inherit; font-weight: 600; }
    #jogo .cheats .botoes-c button:hover:not(:disabled) { background: #3d2e58; border-color: #a855f7; }
    .cheats .chave-c { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
    .cheats .rodape-c { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }

    /* ---------- Efeitos ---------- */
    .flutua {
      position: fixed; pointer-events: none; z-index: 60; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
      font-family: "Cinzel", serif; font-weight: 800; font-size: 1.55rem; line-height: 1;
      text-shadow: 0 2px 0 #000, 0 0 6px #000, 0 0 2px #000;
      animation: sobe calc(1s / var(--vel)) cubic-bezier(.2,.7,.3,1) forwards;
    }
    .flutua .f-ico { width: 22px; height: 22px; }
    .flutua.dano { color: #fff1f1; }
    .flutua.crit { color: #fde047; font-size: 2.3rem; animation-name: sobe-crit; }
    .flutua.bloq { color: #9ca3af; font-size: 1.2rem; }
    .flutua.escudo { color: #93c5fd; }
    .flutua.cura { color: #4ade80; }
    .flutua.ven { color: #15803d; text-shadow: 0 2px 0 #000, 0 0 6px #bbf7d0; }
    .flutua.miss { color: #e2e8f0; font-size: 1.15rem; letter-spacing: .1em; }
    .flutua.gasto { color: var(--escama); font-size: 1.2rem; }

    .ator-heroi.avanca .corpo { animation: avanca-dir calc(.32s / var(--vel)) ease-out; }
    .ator-inimigo.avanca .corpo { animation: avanca-esq calc(.32s / var(--vel)) ease-out; }
    .corpo.atingido .spr, .retrato.atingido .spr { animation: atingido calc(.38s / var(--vel)) ease-out; }
    .ator-heroi.esquiva .corpo { animation: esquiva-esq calc(.4s / var(--vel)) ease-out; }
    .ator-inimigo.esquiva .corpo { animation: esquiva-dir calc(.4s / var(--vel)) ease-out; }
    .flash { animation: flash calc(.45s / var(--vel)); }
    .tremor { animation: tremor calc(.45s / var(--vel)); }
    .tremor-tela { animation: tremor-forte calc(.7s / var(--vel)); }
    .palco.transicao .camada, .palco.transicao .fundo { animation: transicao calc(.6s / var(--vel)) ease-out; }
    .palco.mergulho .fundo { transform: scale(1.06); transition: transform calc(.38s / var(--vel)) ease-in; }
    .camada.aparece { animation: aparece calc(.35s / var(--vel)) ease-out; }
    .morrendo { position: fixed; z-index: 55; pointer-events: none; animation: dissolve calc(.8s / var(--vel)) ease-in forwards; }
    .morrendo .spr { width: 100%; height: 100%; }
    .part { position: fixed; z-index: 58; width: var(--s, 6px); height: var(--s, 6px); border-radius: 50%; pointer-events: none; animation: particula calc(.9s / var(--vel)) ease-out forwards; }
    .part.ouro { background: #fde047; box-shadow: 0 0 8px #fbbf24; }
    .part.cinza { background: #a8a29e; box-shadow: 0 0 6px #57534e; }
    .part.brasa { background: #fb923c; box-shadow: 0 0 8px #ea580c; }
    .part.roxa { background: #c084fc; box-shadow: 0 0 8px #7c3aed; }

    @keyframes respira { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.035) translateY(-1px); } }
    @keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes avanca-dir { 0% { transform: translateX(0); } 35% { transform: translateX(70px) scale(1.04); } 100% { transform: translateX(0); } }
    @keyframes avanca-esq { 0% { transform: translateX(0); } 35% { transform: translateX(-70px) scale(1.04); } 100% { transform: translateX(0); } }
    @keyframes atingido { 0% { filter: brightness(4) saturate(0); transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-3deg); } 45% { filter: brightness(1.6); transform: translateX(8px) rotate(2deg); } 70% { transform: translateX(-4px); } 100% { filter: none; transform: none; } }
    @keyframes esquiva-esq { 0% { transform: none; } 40% { transform: translateX(-46px) skewX(8deg); opacity: .6; } 100% { transform: none; opacity: 1; } }
    @keyframes esquiva-dir { 0% { transform: none; } 40% { transform: translateX(46px) skewX(-8deg); opacity: .6; } 100% { transform: none; opacity: 1; } }
    @keyframes sobe { 0% { transform: translate(-50%, 6px) scale(.7); opacity: 0; } 15% { transform: translate(-50%, -6px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -78px) scale(1); opacity: 0; } }
    @keyframes sobe-crit { 0% { transform: translate(-50%, 6px) scale(.5) rotate(-8deg); opacity: 0; } 18% { transform: translate(-50%, -10px) scale(1.35) rotate(3deg); opacity: 1; } 100% { transform: translate(-50%, -90px) scale(1); opacity: 0; } }
    @keyframes flash { 0% { box-shadow: inset 0 0 0 200px rgba(220,38,38,.3); } 100% { box-shadow: inset 0 0 0 200px rgba(220,38,38,0); } }
    @keyframes tremor { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @keyframes tremor-forte { 10% { transform: translate(-10px, 4px); } 25% { transform: translate(9px, -6px); } 40% { transform: translate(-8px, 5px); } 55% { transform: translate(7px, -3px); } 70% { transform: translate(-4px, 2px); } 85% { transform: translate(2px, -1px); } }
    @keyframes alerta { to { box-shadow: 0 8px 22px rgba(0,0,0,.6), 0 0 22px rgba(220,38,38,.6); } }
    @keyframes nevoa { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
    @keyframes tremeluz { 0% { opacity: .75; transform: translate(-50%, -50%) scale(.96); } 50% { opacity: 1; } 100% { opacity: .82; transform: translate(-50%, -50%) scale(1.04); } }
    .porta-halo, .objeto-central::before { animation-name: pulso; }
    @keyframes pulso { from { opacity: .7; } to { opacity: 1; } }
    @keyframes chama { from { transform: scale(1, 1) skewX(-3deg); } to { transform: scale(.94, 1.08) skewX(3deg); } }
    @keyframes escudo { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes escudo-pulsa { 50% { box-shadow: 0 0 30px rgba(96,165,250,.75), inset 0 0 22px rgba(147,197,253,.55); } }
    @keyframes entrar-porta { to { transform: scale(1.7) translateY(10px); filter: brightness(2.2) blur(1px); opacity: 0; } }
    @keyframes transicao { 0% { opacity: 0; transform: scale(1.12); filter: brightness(2); } 100% { opacity: 1; transform: none; filter: none; } }
    @keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes dissolve { 0% { opacity: 1; filter: brightness(2.5) saturate(0); } 30% { opacity: .9; filter: brightness(1.4) sepia(1) hue-rotate(-20deg); transform: translateY(-4px); } 100% { opacity: 0; filter: brightness(.4) blur(6px); transform: translateY(-18px) scale(1.06, .9); } }
    @keyframes particula { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
    @keyframes carta-entra { from { transform: translateY(24px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes comprado { 0% { box-shadow: 0 0 0 0 rgba(34,211,238,.8); transform: scale(1.03); } 100% { box-shadow: 0 0 0 16px rgba(34,211,238,0); transform: none; } }
    @keyframes gira { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .idle, .ator.voa .idle, .nevoa, .tocha::before, .tocha .chama, .porta-halo, .objeto-central::before, .heroi-centro::before, .intencao.perigo, .aura-escudo { animation: none !important; }

    const $ = id => document.getElementById(id);

      for (const [k, v] of Object.entries(pesos)) { r -= v; if (r < 0) return k; }

    function fmt(n) {
      n = Math.floor(n);

      const i = Math.min(suf.length - 1, Math.floor(Math.log10(n) / 3));

    const pct = v => Math.round(v * 100) + "%";

    // ========================================================

    ];

    const biomaDo = andar => BIOMAS[Math.min(BIOMAS.length - 1, Math.floor((andar - 1) / 10))];
    // Os inimigos ficam mais fortes a cada andar
    const escala = andar => (1 + 0.1 * (andar - 1)) * Math.pow(1.05, andar - 1);

    // ========================================================
    // 3. RELÍQUIAS (valem só durante a expedição)
    // ========================================================
    const RELIQUIAS = {
      lamina:     { emoji: "🗡️", nome: "Lâmina Flamejante",     desc: "+4 de ataque.", mod: { atk: 4 } },
      escudo:     { emoji: "🛡️", nome: "Escudo de Escamas",      desc: "Defender bloqueia 60% a mais." },
      vampiro:    { emoji: "🧛", nome: "Amuleto Vampírico",      desc: "Cura 15% do dano que você causa." },
      botas:      { emoji: "👢", nome: "Botas Silenciosas",      desc: "+10% de esquiva.", mod: { esquiva: 0.10 } },
      anel:       { emoji: "💍", nome: "Anel do Olho Certeiro",  desc: "+12% de chance de crítico.", mod: { crit: 0.12 } },
      troll:      { emoji: "💚", nome: "Coração de Troll",       desc: "Regenera 3% da vida a cada turno." },
      elmo:       { emoji: "⛑️", nome: "Elmo do Cavaleiro",      desc: "+3 de defesa.", mod: { def: 3 } },
      sangue:     { emoji: "🩸", nome: "Sangue de Dragão",       desc: "+30 de vida máxima.", mod: { hp: 30 } },
      runa:       { emoji: "⚡", nome: "Runa do Trovão",         desc: "O Golpe do Caçador recarrega 1 turno mais rápido." },
      bolsa:      { emoji: "👝", nome: "Bolsa do Ladrão",        desc: "+50% de ouro." },
      espinhos:   { emoji: "🌵", nome: "Armadura de Espinhos",   desc: "Devolve 30% do dano recebido." },
      berserker:  { emoji: "🪓", nome: "Fúria do Berserker",     desc: "+50% de ataque com menos de metade da vida." },
      olho:       { emoji: "🎯", nome: "Olho do Caçador",        desc: "Dano dobrado contra dragões." },
      fenix:      { emoji: "🪶", nome: "Pena de Fênix",          desc: "Uma vez por expedição, renasce com 50% da vida." },
      adaga:      { emoji: "🔪", nome: "Adaga Envenenada",       desc: "Seus ataques envenenam o inimigo." },
      alquimista: { emoji: "⚗️", nome: "Frasco do Alquimista",   desc: "Poções curam 60% em vez de 40%." },
      gemea:      { emoji: "⚔️", nome: "Lâmina Gêmea",           desc: "25% de chance de atacar duas vezes." },
      tomo:       { emoji: "📕", nome: "Tomo do Sábio",          desc: "+30% de experiência." },
      cristal:    { emoji: "🔮", nome: "Cristal da Fúria",       desc: "O Golpe do Caçador causa 4× em vez de 2,5×." },
      capa:       { emoji: "🧥", nome: "Capa das Sombras",       desc: "O primeiro golpe inimigo de cada combate sempre erra." },
      coroa:      { emoji: "👑", nome: "Coroa do Rei Caído",     desc: "+2 de ataque, +2 de defesa e +15 de vida.", mod: { atk: 2, def: 2, hp: 15 } },
      talisma:    { emoji: "🧿", nome: "Talismã Purificador",    desc: "Imunidade a veneno." },
    };

    // ========================================================
    // 4. GUILDA DOS CAÇADORES (melhorias permanentes)
    // ========================================================
    const GUILDA = [
      { id: "vigor",     emoji: "💗", nome: "Vigor",            desc: "+10 de vida máxima.",              custo: 5,   max: 50 },
      { id: "forca",     emoji: "💪", nome: "Força",            desc: "+1 de ataque.",                    custo: 5,   max: 50 },
      { id: "armadura",  emoji: "🛡️", nome: "Armadura",         desc: "+1 de defesa.",                    custo: 8,   max: 30 },
      { id: "precisao",  emoji: "🎯", nome: "Precisão",         desc: "+2% de chance de crítico.",        custo: 10,  max: 20 },
      { id: "agilidade", emoji: "💨", nome: "Agilidade",        desc: "+1,5% de esquiva.",                custo: 10,  max: 20 },
      { id: "alquimia",  emoji: "🧪", nome: "Alquimia",         desc: "+1 poção no início.",              custo: 15,  max: 5 },
      { id: "ganancia",  emoji: "💰", nome: "Ganância",         desc: "+15% de ouro.",                    custo: 8,   max: 20 },
      { id: "sabedoria", emoji: "📖", nome: "Sabedoria",        desc: "+10% de experiência.",             custo: 12,  max: 20 },

      { id: "escudeiro", emoji: "🤖", nome: "Escudeiro",        desc: "Libera o combate automático.",     custo: 50,  max: 1 },

      { id: "batedor",   emoji: "🧭", nome: "Batedor",          desc: "Libera a exploração automática (modo ocioso).", custo: 150, max: 1 },
    ];
    const custoGuilda = u => Math.ceil(u.custo * Math.pow(1.4, nivelG(u.id)) * meta.cheats.precoGuilda);

    // ========================================================
    // 5. ESTADO
    // ========================================================
    const CHAVE = "cacador-dragoes-v1";
    // Cheats: multiplicadores que você pode mudar no painel 🧪
    const novosCheats = () => ({ escamas: 1, ouro: 1, xp: 1, vidaInimigo: 1, danoInimigo: 1, danoHeroi: 1, precoGuilda: 1, deus: false });
    const novaMeta = () => ({
      escamas: 0, totalEscamas: 0, guilda: {}, recorde: 1, dragoes: 0, expedicoes: 0, abates: 0, checkpoint: 0,
      auto: { combate: false, explorar: false, reiniciar: false }, vel: 1,
      cheats: novosCheats(),
    });
    let meta = novaMeta();
    let run = null;          // a expedição atual (null = no acampamento)
    let registro = [];       // mensagens do diário
    let ocupado = false;     // true enquanto o inimigo "pensa"
    let fila = [];           // efeitos visuais esperando a tela ser desenhada

    const nivelG = id => meta.guilda[id] || 0;
    const tem = id => run && run.reliquias.includes(id);
    const C = () => meta.cheats;
    const multOuro = () => (1 + 0.15 * nivelG("ganancia")) * (tem("bolsa") ? 1.5 : 1) * C().ouro;

    const xpProx = n => Math.round(15 * Math.pow(1.28, n - 1));

    // Atributos atuais do herói (base da expedição + relíquias)
    function H() {
      let atk = run.atk, hpMax = run.hpMax, def = run.def, crit = run.crit, esq = run.esquiva;

        const m = RELIQUIAS[id].mod;

        atk += m.atk || 0; hpMax += m.hp || 0; def += m.def || 0; crit += m.crit || 0; esq += m.esquiva || 0;

      if (tem("berserker") && run.hp < hpMax * 0.5) atk *= 1.5;
      return { atk, hpMax, def, crit: Math.min(crit, 1), esq: Math.min(esq, 0.6), critMult: run.critMult };

    // ========================================================

    function log(texto, tipo = "") {
      registro.unshift({ texto, tipo });

    }
    const fx = (alvo, texto, tipo) => fila.push({ alvo, texto, tipo });

    // ========================================================
    // 7. EXPEDIÇÃO
    // ========================================================
    function novaExpedicao(inicio = 1) {
      run = {
        andar: inicio, inicio,
        hpMax: 50 + 10 * nivelG("vigor"), atk: 6 + nivelG("forca"), def: nivelG("armadura"),

      run.hp = run.hpMax;
      registro = [];
      log(`🔥 Você acende a tocha e desce à masmorra${inicio > 1 ? ` pelo atalho até o andar ${inicio}` : ""}.`, "sist");
      if (nivelG("bencao")) ganharReliquia(reliquiaAleatoria(), "A Bênção do Templo concede");
      // Atalho do mapa: compensa os andares pulados
      const pulos = Math.floor((inicio - 1) / 10);
      for (let i = 0; i < pulos; i++) {
        ganharReliquia(reliquiaAleatoria(), "Você encontra no caminho");
        for (let k = 0; k < 4; k++) { run.nivel++; aplicarCarta(sortear(["atk", "hp", "atk", "hp", "def"]), true); }
        run.ouro += 60;
